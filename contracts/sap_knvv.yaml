name: sap_knvv
version: 1
owner: sales-squad
description: Customer data per sales area (SAP KNVV).
source_system: [PS4]
landing_path: sap/{source_system}/KNVV/
format: parquet
allow_empty: true
allow_new_columns: false
primary_key: [KUNNR, VKORG, VTWEG, SPART]
change_mode_column: _op
order_columns: [_change_ts, _seq]
arrival: daily by 01:30 UTC
columns:
  - {name: KUNNR, type: string, required: true, pattern: '^[0-9]{10}$'}
  - {name: VKORG, type: string, required: true, pattern: '^[0-9]{4}$'}
  - {name: VTWEG, type: string, required: true, pattern: '^[0-9]{2}$'}
  - {name: SPART, type: string, required: true, pattern: '^[0-9]{2}$'}
  - {name: BZIRK, type: string, required: true}
  - {name: KDGRP, type: string, required: true}
  - {name: VKBUR, type: string, required: false}
  # Technical columns added by the replication layer.
  - {name: _op, type: string, required: true, allowed: [I, U, D]}
  - {name: _change_ts, type: timestamp, required: true}
  - {name: _seq, type: integer, required: true, min: 0}
  - {name: _extract_id, type: string, required: true}
  - {name: _source_system, type: string, required: true, allowed: [PS4]}
