name: sap_tcurr
version: 1
owner: finance-squad
description: Exchange rates (SAP TCURR).
source_system: [PS4]
landing_path: sap/{source_system}/TCURR/
format: parquet
allow_empty: true
allow_new_columns: false
primary_key: [KURST, FCURR, TCURR, GDATU]
change_mode_column: _op
order_columns: [_change_ts, _seq]
arrival: daily by 01:30 UTC
columns:
  - {name: KURST, type: string, required: true, allowed: [M, ZAVG]}
  - {name: FCURR, type: string, required: true, pattern: '^[A-Z]{3}$'}
  - {name: TCURR, type: string, required: true, pattern: '^[A-Z]{3}$'}
  # Stored inverted: 99999999 - YYYYMMDD.
  - {name: GDATU, type: string, required: true, pattern: '^[0-9]{8}$'}
  # Negative means an indirect quote (rate = 1 / |UKURS|).
  - {name: UKURS, type: 'decimal(9,5)', required: true}
  - {name: FFACT, type: integer, required: true, min: 1}
  - {name: TFACT, type: integer, required: true, min: 1}
  # Technical columns added by the replication layer.
  - {name: _op, type: string, required: true, allowed: [I, U, D]}
  - {name: _change_ts, type: timestamp, required: true}
  - {name: _seq, type: integer, required: true, min: 0}
  - {name: _extract_id, type: string, required: true}
  - {name: _source_system, type: string, required: true, allowed: [PS4]}
