name: sap_kna1
version: 1
owner: sales-squad
description: Customer general data (SAP KNA1).
source_system: [PS4]
landing_path: sap/{source_system}/KNA1/
format: parquet
allow_empty: true
allow_new_columns: false
primary_key: [KUNNR]
change_mode_column: _op
order_columns: [_change_ts, _seq]
arrival: daily by 01:30 UTC
columns:
  - {name: KUNNR, type: string, required: true, pattern: '^[0-9]{10}$'}
  - {name: NAME1, type: string, required: true}
  - {name: LAND1, type: string, required: true, pattern: '^[A-Z]{2}$'}
  - {name: ORT01, type: string, required: false}
  - {name: PSTLZ, type: string, required: false}
  - {name: KTOKD, type: string, required: true}
  - {name: LOEVM, type: string, required: false, allowed: ["", X]}
  # Technical columns added by the replication layer.
  - {name: _op, type: string, required: true, allowed: [I, U, D]}
  - {name: _change_ts, type: timestamp, required: true}
  - {name: _seq, type: integer, required: true, min: 0}
  - {name: _extract_id, type: string, required: true}
  - {name: _source_system, type: string, required: true, allowed: [PS4]}
