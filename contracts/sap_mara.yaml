name: sap_mara
version: 1
owner: product-squad
description: Item general data (SAP MARA).
source_system: [PS4]
landing_path: sap/{source_system}/MARA/
format: parquet
allow_empty: true
allow_new_columns: false
primary_key: [MATNR]
change_mode_column: _op
order_columns: [_change_ts, _seq]
arrival: daily by 01:30 UTC
columns:
  - {name: MATNR, type: string, required: true, pattern: '^[0-9]{18}$'}
  - {name: MTART, type: string, required: true}
  - {name: MEINS, type: string, required: true}
  # Business unit (5) + therapy area (5) + brand (8).
  - {name: PRDHA, type: string, required: true, pattern: '^[A-Z0-9]{18}$'}
  # US items carry an 11-digit NDC; non-US items leave it empty.
  - {name: ZZ_NDC, type: string, required: false, pattern: '^([0-9]{11})?$'}
  - {name: LVORM, type: string, required: false, allowed: ["", X]}
  # Technical columns added by the replication layer.
  - {name: _op, type: string, required: true, allowed: [I, U, D]}
  - {name: _change_ts, type: timestamp, required: true}
  - {name: _seq, type: integer, required: true, min: 0}
  - {name: _extract_id, type: string, required: true}
  - {name: _source_system, type: string, required: true, allowed: [PS4]}
