name: CI

# Developers push feature branches from their Databricks Git folders, so every push runs CI
# and GitHub emails the pusher when it fails. Pull requests into the protected branches run it
# again on the merge result. Throwaway exp/ branches are skipped.
on:
  push:
    branches-ignore: ["exp/**"]
  pull_request:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same version as requirements-dev.txt and tools/run_checks, so results match everywhere.
      - run: pip install ruff==0.17.0
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - run: pip install -r requirements-dev.txt
      - run: >-
          pytest -m "not integration"
          --cov=src/halvern
          --cov=generator/halvern_gen
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=70
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
